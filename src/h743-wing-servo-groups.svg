<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Verdana, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <g id="pin">
      <rect x="-9" y="-9" width="18" height="18" fill="#fff" stroke="#111" stroke-width="2"/>
      <rect x="-4" y="-4" width="8" height="8" fill="#111"/>
    </g>
  </defs>

  <rect width="1000" height="600" fill="#fff"/>

  <!-- board edge with header -->
  <path d="M110,240 L110,70 Q110,55 125,55 L875,55 Q890,55 890,70 L890,240" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M110,240 L890,240" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="2 8"/>

  <!-- header housing: col n at x = 200 + (15-n)*40, rows G/V/S at y = 95/135/175 -->
  <rect x="178" y="73" width="604" height="124" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="3"/>

  <!-- group outlines on header -->
  <g fill="none" stroke="#111" stroke-width="2" stroke-dasharray="7 5">
    <rect x="183" y="66" width="114" height="138" rx="8"/>
    <rect x="303" y="66" width="34" height="138" rx="8"/>
    <rect x="343" y="66" width="314" height="138" rx="8"/>
    <rect x="663" y="66" width="114" height="138" rx="8"/>
  </g>
  <!-- S12 highlight -->
  <circle cx="320" cy="175" r="15" fill="#ffda1a" stroke="#111" stroke-width="2"/>

  <g id="pins">
    <g transform="translate(200,95)"><use href="#pin"/></g><g transform="translate(200,135)"><use href="#pin"/></g><g transform="translate(200,175)"><use href="#pin"/></g>
    <g transform="translate(240,95)"><use href="#pin"/></g><g transform="translate(240,135)"><use href="#pin"/></g><g transform="translate(240,175)"><use href="#pin"/></g>
    <g transform="translate(280,95)"><use href="#pin"/></g><g transform="translate(280,135)"><use href="#pin"/></g><g transform="translate(280,175)"><use href="#pin"/></g>
    <g transform="translate(320,95)"><use href="#pin"/></g><g transform="translate(320,135)"><use href="#pin"/></g><g transform="translate(320,175)"><use href="#pin"/></g>
    <g transform="translate(360,95)"><use href="#pin"/></g><g transform="translate(360,135)"><use href="#pin"/></g><g transform="translate(360,175)"><use href="#pin"/></g>
    <g transform="translate(400,95)"><use href="#pin"/></g><g transform="translate(400,135)"><use href="#pin"/></g><g transform="translate(400,175)"><use href="#pin"/></g>
    <g transform="translate(440,95)"><use href="#pin"/></g><g transform="translate(440,135)"><use href="#pin"/></g><g transform="translate(440,175)"><use href="#pin"/></g>
    <g transform="translate(480,95)"><use href="#pin"/></g><g transform="translate(480,135)"><use href="#pin"/></g><g transform="translate(480,175)"><use href="#pin"/></g>
    <g transform="translate(520,95)"><use href="#pin"/></g><g transform="translate(520,135)"><use href="#pin"/></g><g transform="translate(520,175)"><use href="#pin"/></g>
    <g transform="translate(560,95)"><use href="#pin"/></g><g transform="translate(560,135)"><use href="#pin"/></g><g transform="translate(560,175)"><use href="#pin"/></g>
    <g transform="translate(600,95)"><use href="#pin"/></g><g transform="translate(600,135)"><use href="#pin"/></g><g transform="translate(600,175)"><use href="#pin"/></g>
    <g transform="translate(640,95)"><use href="#pin"/></g><g transform="translate(640,135)"><use href="#pin"/></g><g transform="translate(640,175)"><use href="#pin"/></g>
    <g transform="translate(680,95)"><use href="#pin"/></g><g transform="translate(680,135)"><use href="#pin"/></g><g transform="translate(680,175)"><use href="#pin"/></g>
    <g transform="translate(720,95)"><use href="#pin"/></g><g transform="translate(720,135)"><use href="#pin"/></g><g transform="translate(720,175)"><use href="#pin"/></g>
    <g transform="translate(760,95)"><use href="#pin"/></g><g transform="translate(760,135)"><use href="#pin"/></g><g transform="translate(760,175)"><use href="#pin"/></g>
  </g>

  <!-- row labels -->
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#111">
    <text x="150" y="101">G</text><text x="150" y="141">V</text><text x="150" y="181">S</text>
    <text x="812" y="101">G</text><text x="812" y="141">V</text><text x="812" y="181">S</text>
  </g>

  <!-- column numbers -->
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#111">
    <text x="200" y="228">15</text><text x="240" y="228">14</text><text x="280" y="228">13</text>
    <text x="320" y="228">12</text><text x="360" y="228">11</text><text x="400" y="228">10</text>
    <text x="440" y="228">9</text><text x="480" y="228">8</text><text x="520" y="228">7</text>
    <text x="560" y="228">6</text><text x="600" y="228">5</text><text x="640" y="228">4</text>
    <text x="680" y="228">3</text><text x="720" y="228">2</text><text x="760" y="228">1</text>
  </g>

  <!-- group brackets and leaders to panels -->
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <path d="M190,252 L190,262 L290,262 L290,252 M240,262 L240,300 L155,300 L155,338"/>
    <path d="M320,248 L320,300 L385,300 L385,338"/>
    <path d="M350,252 L350,262 L650,262 L650,252 M500,262 L500,300 L615,300 L615,338"/>
    <path d="M670,252 L670,262 L770,262 L770,252 M720,262 L720,300 L845,300 L845,338"/>
  </g>

  <!-- panels -->
  <g fill="#fff" stroke="#111" stroke-width="3">
    <rect x="50" y="340" width="210" height="200" rx="14"/>
    <rect x="280" y="340" width="210" height="200" rx="14" fill="#fff7cc"/>
    <rect x="510" y="340" width="210" height="200" rx="14"/>
    <rect x="740" y="340" width="210" height="200" rx="14"/>
  </g>

  <!-- panel 1: S13-15 GPIO OUT (lamp/relay load) -->
  <g transform="translate(155,410)">
    <use href="#pin" x="-70"/>
    <line x1="-55" y1="0" x2="-22" y2="0" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
    <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
      <path d="M20,14 C4,4 4,-30 30,-32 C56,-30 56,4 40,14 Z" fill="#fff"/>
      <rect x="20" y="14" width="20" height="14" rx="2" fill="#e6e6e6"/>
      <path d="M24,8 L28,-12 L32,-4 L36,-12" stroke-width="2"/>
      <path d="M62,-30 L72,-38 M66,-12 L78,-12 M62,6 L72,14" stroke-width="2.5"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="155" y="478" font-size="20" font-weight="bold">GPIO OUT</text>
    <text x="155" y="502" font-size="13">3.3 V, starts LOW</text>
    <text x="155" y="522" font-size="13">GPIO 62 · 63 · 64</text>
  </g>

  <!-- panel 2: S12 GPIO IN 5V (tacho) -->
  <g transform="translate(385,410)">
    <use href="#pin" x="-70"/>
    <line x1="-22" y1="0" x2="-55" y2="0" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
    <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
      <circle cx="22" cy="-6" r="28" fill="#fff"/>
      <path d="M22,-6 C22,-24 34,-30 40,-24 C40,-14 30,-8 22,-6 Z" fill="#e6e6e6" stroke-width="2"/>
      <path d="M22,-6 C38,0 40,14 32,18 C24,16 22,6 22,-6 Z" fill="#e6e6e6" stroke-width="2"/>
      <path d="M22,-6 C10,8 -2,6 -4,-2 C0,-10 10,-10 22,-6 Z" fill="#e6e6e6" stroke-width="2"/>
      <circle cx="22" cy="-6" r="5" fill="#111"/>
      <path d="M-2,32 L8,32 L8,24 L18,24 L18,32 L28,32 L28,24 L38,24 L38,32 L48,32" stroke-width="2"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="385" y="478" font-size="20" font-weight="bold">GPIO IN 5V</text>
    <text x="385" y="502" font-size="13">tacho / RPM</text>
    <text x="385" y="522" font-size="13">RPM1_PIN = 61</text>
  </g>

  <!-- panel 3: S4-11 SERVO OUT -->
  <g transform="translate(615,410)">
    <use href="#pin" x="-70"/>
    <line x1="-55" y1="0" x2="-22" y2="0" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
    <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
      <rect x="-6" y="-14" width="62" height="34" rx="4" fill="#e6e6e6"/>
      <rect x="-14" y="-6" width="78" height="8" rx="2" fill="#fff"/>
      <circle cx="12" cy="-20" r="7" fill="#fff"/>
      <path d="M8,-24 L40,-40 Q46,-40 44,-34 L16,-16 Z" fill="#fff" stroke-width="2.5"/>
      <path d="M54,-44 A44,44 0 0 1 66,-24" stroke-width="2" marker-end="url(#ah)"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="615" y="478" font-size="20" font-weight="bold">SERVO OUT</text>
    <text x="615" y="502" font-size="13">PWM</text>
    <text x="615" y="522" font-size="13">S4 – S11</text>
  </g>

  <!-- panel 4: S1-3 BiDSHOT (motor + prop, two-way) -->
  <g transform="translate(845,410)">
    <use href="#pin" x="-70"/>
    <line x1="-57" y1="0" x2="-10" y2="0" stroke="#111" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
      <path d="M2,22 L2,-6 Q2,-14 10,-14 L38,-14 Q46,-14 46,-6 L46,22 Z" fill="#e6e6e6"/>
      <path d="M2,4 L46,4 M2,14 L46,14" stroke-width="1.5"/>
      <rect x="20" y="-24" width="8" height="10" fill="#fff"/>
      <ellipse cx="24" cy="-30" rx="40" ry="6" fill="#fff"/>
      <circle cx="24" cy="-30" r="4" fill="#111"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="845" y="478" font-size="20" font-weight="bold">BiDSHOT</text>
    <text x="845" y="502" font-size="13">ESC + eRPM back</text>
    <text x="845" y="522" font-size="13">S1 – S3</text>
  </g>

  <!-- footnote -->
  <g fill="#111">
    <circle cx="66" cy="572" r="12" fill="#ffda1a" stroke="#111" stroke-width="2"/>
    <text x="66" y="578" font-size="16" font-weight="bold" text-anchor="middle">!</text>
    <text x="88" y="577" font-size="13">Defaults only. Any output can be reconfigured with SERVOn_FUNCTION, then reboot.</text>
  </g>
</svg>
